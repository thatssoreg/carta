name: Validate CARTA

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: atlas-app/package-lock.json

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile validation code
        run: >-
          python -m py_compile
          scripts/validate_data.py
          scripts/audit_navigation.py
          scripts/build_atlas.py
          scripts/build_terrain.py
          scripts/validate_atlas.py
          tests/test_navigation.py
          tests/test_atlas.py

      - name: Validate structured authority and Human Reference profiles
        run: python scripts/validate_data.py

      - name: Test Human Reference navigation semantics
        run: python -m unittest discover -s tests -v

      - name: Validate CARTA Atlas manifests, mappings, semantics, and assets
        run: python scripts/validate_atlas.py

      - name: Build CARTA Atlas static application
        run: |
          npm ci --prefix atlas-app
          npm run build --prefix atlas-app

      - name: Audit navigation regression fixture
        run: |
          python scripts/audit_navigation.py \
            --ratings audits/run-10-human-reference-navigation-ratings.json \
            --format json

      - name: Verify deterministic Human Reference regeneration
        run: |
          python scripts/validate_data.py --write-human-reference
          git diff --exit-code
