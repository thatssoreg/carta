name: Generate Lampyres Matassa Bridge Human Reference

on:
  push:
    branches:
      - run-09-lampyres-matassa-bridge

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bridge branch
        uses: actions/checkout@v4
        with:
          ref: run-09-lampyres-matassa-bridge

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate deterministic Human Reference
        run: python scripts/validate_data.py --write-human-reference

      - name: Validate generated authority
        run: python scripts/validate_data.py

      - name: Commit generated projection
        run: |
          if git diff --quiet; then
            echo "Human Reference already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas
          git commit -m "Generate Lampyres Matassa bridge Human Reference"
          git push origin HEAD:run-09-lampyres-matassa-bridge
